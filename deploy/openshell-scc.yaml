# Targeted SCC for OpenShell + Kata on OpenShift
#
# More restrictive than 'privileged' -- allows only the four
# capabilities the sandbox supervisor requires.
#
# Reference:
#   https://github.com/bpradipt/OpenShell/blob/kata/docs/kubernetes/openshift-sandboxed-containers.mdx
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: openshell-kata
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
allowedCapabilities:
  - SYS_ADMIN
  - NET_ADMIN
  - SYS_PTRACE
  - SYSLOG
defaultAddCapabilities: []
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users: []
groups: []
